version: 2
# Dependabot can only reach registries listed here, and the project restores from these feeds (Directory.Build.targets).
registries:
  bepinex:
    type: nuget-feed
    url: https://nuget.bepinex.dev/v3/index.json
  windows10ce:
    type: nuget-feed
    url: https://nuget.windows10ce.com/nuget/v3/index.json
updates:
  - package-ecosystem: nuget
    directory: /
    registries:
      - bepinex
      - windows10ce
    schedule:
      interval: weekly
    # Mirrors .repo-ops.toml: GameLibs tracks the targeted game build by hand, and the game loads BepInEx 5.
    ignore:
      - dependency-name: LethalCompany.GameLibs.Steam
      - dependency-name: BepInEx.Core
        versions: [">= 6.0.0-0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
